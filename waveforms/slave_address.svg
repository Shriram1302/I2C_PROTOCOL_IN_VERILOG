<svg viewBox="0 0 660 210" xmlns="http://www.w3.org/2000/svg" font-family="Consolas,Menlo,monospace">
  <defs>
    <linearGradient id="bg-slave_address" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b2e"/>
    </linearGradient>
    <filter id="glow-slave_address">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="0" y="0" width="660" height="210" rx="14" fill="url(#bg-slave_address)"/>
  <text x="16" y="200" font-size="11" fill="#5b6478">beginner-friendly Verilog I2C</text>
  
    <text x="260" y="28" text-anchor="middle" font-family="Consolas,Menlo,monospace" font-size="15" font-weight="700" fill="#ff7edb">
      ① 7-bit SLAVE ADDRESS (MSB first)
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.03;0.05;0.45;0.47000000000000003;1" dur="6s" repeatCount="indefinite"/>
    </text>
    <text x="470" y="28" text-anchor="middle" font-family="Consolas,Menlo,monospace" font-size="15" font-weight="700" fill="#ff7edb">
      ② R/W bit (0=write)
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.45;0.47000000000000003;0.6;0.62;1" dur="6s" repeatCount="indefinite"/>
    </text>
    <text x="560" y="28" text-anchor="middle" font-family="Consolas,Menlo,monospace" font-size="15" font-weight="700" fill="#ff7edb">
      ③ ACK from slave (SDA pulled low)
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.6;0.62;0.9;0.92;1" dur="6s" repeatCount="indefinite"/>
    </text>

  <text x="10" y="60" font-size="13" fill="#fbbf24" font-weight="700">SCL</text>
  <polyline points="40,55 60,55 60,55 60,95 90,95 90,95 90,55 120,55 120,55 120,95 150,95 150,95 150,55 180,55 180,55 180,95 210,95 210,95 210,55 240,55 240,55 240,95 270,95 270,95 270,55 300,55 300,55 300,95 330,95 330,95 330,55 360,55 360,55 360,95 390,95 390,95 390,55 420,55 420,55 420,95 450,95 450,95 450,55 480,55 480,55 480,95 510,95 510,95 510,55 540,55 540,55 540,95 570,95 570,95 570,55 600,55 620,55" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linejoin="round" filter="url(#glow-slave_address)"/>

  <text x="10" y="150" font-size="13" fill="#2dd4bf" font-weight="700">SDA</text>
  <polyline points="40,145 60,145 120,145 120,145 120,185 180,185 180,185 180,145 240,145 240,145 240,185 300,185 300,185 300,145 360,145 360,145 360,185 420,185 420,185 420,145 480,145 480,145 480,185 540,185 600,185 600,185 600,145 620,145" fill="none" stroke="#2dd4bf" stroke-width="3" stroke-linejoin="round" filter="url(#glow-slave_address)"/>

  <line x1="40" y1="0" x2="40" y2="0" stroke="#ff3d68" stroke-width="2">
  </line>
  <rect x="38" y="20" width="3" height="175" fill="#ff3d68" opacity="0.9">
    <animate attributeName="x" values="40;620" dur="6s" repeatCount="indefinite"/>
  </rect>
  <circle cx="40" cy="20" r="4" fill="#ff3d68">
    <animate attributeName="cx" values="40;620" dur="6s" repeatCount="indefinite"/>
  </circle>
</svg>