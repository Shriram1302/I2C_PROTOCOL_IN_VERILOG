<svg viewBox="0 0 480 230" xmlns="http://www.w3.org/2000/svg" font-family="Consolas,Menlo,monospace">
  <defs>
    <linearGradient id="bg-start_condition" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b2e"/>
    </linearGradient>
    <filter id="glow-start_condition">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrowhead-start_condition" viewBox="0 0 10 10" refX="5" refY="8" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 10 L5 0 L10 10 Z" fill="#ff3d68"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="480" height="230" rx="14" fill="url(#bg-start_condition)"/>
  <text x="16" y="220" font-size="11" fill="#5b6478">beginner-friendly Verilog I2C</text>

  <text x="130" y="28" text-anchor="middle" font-family="Consolas,Menlo,monospace" font-size="15" font-weight="700" fill="#ff7edb">
    &#9312; IDLE: SDA=1, SCL=1
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.0;0.02;0.3;0.32;1" dur="5s" repeatCount="indefinite"/>
  </text>
  <text x="345" y="28" text-anchor="middle" font-family="Consolas,Menlo,monospace" font-size="15" font-weight="700" fill="#ff7edb">
    &#9313; START: SDA falls first, then SCL
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3;0.32;0.85;0.87;1" dur="5s" repeatCount="indefinite"/>
  </text>

  <text x="10" y="60" font-size="13" fill="#fbbf24" font-weight="700">SCL</text>
  <polyline points="40,55 260,55 260,95 440,95" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" filter="url(#glow-start_condition)"/>

  <text x="10" y="150" font-size="13" fill="#2dd4bf" font-weight="700">SDA</text>
  <polyline points="40,145 220,145 220,185 440,185" fill="none" stroke="#2dd4bf" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" filter="url(#glow-start_condition)"/>

  <line x1="220" y1="35" x2="220" y2="195" stroke="#ff3d68" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowhead-start_condition)"/>
  <text x="220" y="212" text-anchor="middle" font-size="11" fill="#ff3d68" font-weight="700">S (START)</text>

  <rect x="38" y="20" width="3" height="175" fill="#ff3d68" opacity="0.5">
    <animate attributeName="x" values="40;440" dur="5s" repeatCount="indefinite"/>
  </rect>
</svg>
