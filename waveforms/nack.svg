<svg viewBox="0 0 440 220" xmlns="http://www.w3.org/2000/svg" font-family="Consolas,Menlo,monospace">
  <defs>
    <linearGradient id="bg-nack" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b2e"/>
    </linearGradient>
    <filter id="glow-nack">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="0" y="0" width="440" height="220" rx="14" fill="url(#bg-nack)"/>
  <text x="16" y="210" font-size="11" fill="#5b6478">beginner-friendly Verilog I2C</text>

  <text x="220" y="26" text-anchor="middle" font-family="Consolas,Menlo,monospace" font-size="14" font-weight="700" fill="#ff7edb">
    ① Receiver leaves SDA HIGH (no pull-down)
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.0;0.02;0.4;0.42;1" dur="5s" repeatCount="indefinite"/>
  </text>
  <text x="220" y="26" text-anchor="middle" font-family="Consolas,Menlo,monospace" font-size="14" font-weight="700" fill="#ff7edb">
    ② SCL pulses while SDA stays HIGH = NACK
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.4;0.42;0.9;0.92;1" dur="5s" repeatCount="indefinite"/>
  </text>

  <!-- SDA -->
  <text x="10" y="55" font-size="13" fill="#2dd4bf" font-weight="700">SDA</text>
  <text x="34" y="45" font-size="9" fill="#5b6478">HIGH</text>
  <text x="34" y="88" font-size="9" fill="#5b6478">LOW</text>
  <line x1="60" y1="40" x2="400" y2="40" stroke="#2a3348" stroke-width="1" stroke-dasharray="2,3"/>
  <line x1="60" y1="83" x2="400" y2="83" stroke="#2a3348" stroke-width="1" stroke-dasharray="2,3"/>
  <polyline points="60,83 150,83 182,40 400,40" fill="none" stroke="#2dd4bf" stroke-width="3" stroke-linejoin="round" filter="url(#glow-nack)"/>

  <!-- SCL -->
  <text x="10" y="155" font-size="13" fill="#fbbf24" font-weight="700">SCL</text>
  <text x="34" y="145" font-size="9" fill="#5b6478">HIGH</text>
  <text x="34" y="188" font-size="9" fill="#5b6478">LOW</text>
  <line x1="60" y1="140" x2="400" y2="140" stroke="#2a3348" stroke-width="1" stroke-dasharray="2,3"/>
  <line x1="60" y1="183" x2="400" y2="183" stroke="#2a3348" stroke-width="1" stroke-dasharray="2,3"/>
  <polyline points="60,183 175,183 200,140 270,140 295,183 400,183" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linejoin="round" filter="url(#glow-nack)"/>

  <!-- guide lines marking the ACK/NACK clock pulse window -->
  <line x1="200" y1="40" x2="200" y2="183" stroke="#3a4260" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="270" y1="40" x2="270" y2="183" stroke="#3a4260" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="235" y="205" text-anchor="middle" font-size="13" fill="#ff3d68" font-weight="700">NACK</text>

  <!-- moving marker sweeping across the timing diagram -->
  <rect x="58" y="30" width="3" height="163" fill="#ff3d68" opacity="0.9">
    <animate attributeName="x" values="60;400" dur="5s" repeatCount="indefinite"/>
  </rect>
  <circle cx="60" cy="30" r="4" fill="#ff3d68">
    <animate attributeName="cx" values="60;400" dur="5s" repeatCount="indefinite"/>
  </circle>
</svg>
